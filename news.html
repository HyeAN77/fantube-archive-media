
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>기사 | FANTUBE ARCHIVE MEDIA</title>

  <meta
    name="description"
    id="meta-description"
    content="FANTUBE ARCHIVE MEDIA의 K-POP 및 문화·연예 뉴스"
  >

  <!-- 검색엔진 대표 URL -->
  <link
    rel="canonical"
    id="canonical-url"
    href="https://fantubearchive.com/"
  >

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="FANTUBE ARCHIVE MEDIA">

  <meta
    property="og:title"
    id="og-title"
    content="FANTUBE ARCHIVE MEDIA"
  >

  <meta
    property="og:description"
    id="og-description"
    content="K-POP 및 문화·연예 뉴스"
  >

  <meta
    property="og:url"
    id="og-url"
    content="https://fantubearchive.com/"
  >

  <meta
    property="og:image"
    id="og-image"
    content=""
  >

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twitter-title" content="FANTUBE ARCHIVE MEDIA">
  <meta name="twitter:description" id="twitter-description" content="K-POP 및 문화·연예 뉴스">
  <meta name="twitter:image" id="twitter-image" content="">

  <meta name="robots" content="index, follow">

  <link rel="stylesheet" href="/style.css">

  <style>
    .article-page {
      max-width: 850px;
      margin: 0 auto;
      padding: 100px 24px;
    }

    .article-back {
      display: inline-block;
      margin-bottom: 30px;
      color: inherit;
      text-decoration: none;
    }

    .article-back:hover {
      opacity: 0.6;
    }

    .article-title {
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.3;
      margin: 20px 0;
      overflow-wrap: anywhere;
    }

    .article-meta {
      margin: 20px 0 36px;
      color: #888;
      font-size: 13px;
    }

    .article-body {
      font-size: 17px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .article-body p {
      margin: 0 0 24px;
    }

    .article-photo {
      margin: 0 0 36px;
      padding: 0;
    }

    .article-photo img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .article-photo figcaption {
      margin-top: 10px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }

    .article-photo figcaption span {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .article-status {
      padding: 60px 0;
      color: #888;
      line-height: 1.8;
    }

    .article-status[hidden],
    .article-body[hidden],
    .article-photo[hidden] {
      display: none;
    }
  </style>
</head>

<body>

  <main class="article-page">

    <a class="article-back" href="/#news">
      ← NEWS 목록으로
    </a>

    <p class="news-category" id="article-category">
      NEWS
    </p>

    <h1 class="article-title" id="article-title">
      기사를 불러오는 중입니다.
    </h1>

    <p class="article-meta" id="article-meta">
      FANTUBE ARCHIVE MEDIA
    </p>

    <div id="article-status" class="article-status">
      잠시만 기다려 주세요.
    </div>

    <article class="article-body" id="article-content" hidden>

      <figure class="article-photo" id="article-photo" hidden>
        <img
          id="article-image"
          src=""
          alt=""
        >

        <figcaption>
          <span>PHOTO © FANTUBE ARCHIVE MEDIA</span>
        </figcaption>
      </figure>

      <div id="article-text"></div>

      <p>
        <a href="/#archive">
          FANTUBE ARCHIVE MEDIA 영상 아카이브 둘러보기 ↗
        </a>
      </p>

    </article>

  </main>

  <script>
    const API_URL = "/api/articles";
    const SITE_URL = "https://fantubearchive.com";

    /*
      새 주소:
      /news/기사슬러그

      기존 주소도 호환:
      /gisa?slug=기사슬러그
      /gisa?id=기사ID
    */

    function getArticleSlug() {
      const pathParts = window.location.pathname
        .split("/")
        .filter(Boolean);

      if (
        pathParts.length >= 2 &&
        pathParts[0] === "news"
      ) {
        try {
          return decodeURIComponent(pathParts[1]);
        } catch (error) {
          return pathParts[1];
        }
      }

      const params = new URLSearchParams(
        window.location.search
      );

      return params.get("slug") || "";
    }

    function getArticleId() {
      const params = new URLSearchParams(
        window.location.search
      );

      return params.get("id") || "";
    }

    const slug = getArticleSlug();
    const id = getArticleId();

    const titleElement =
      document.getElementById("article-title");

    const categoryElement =
      document.getElementById("article-category");

    const metaElement =
      document.getElementById("article-meta");

    const statusElement =
      document.getElementById("article-status");

    const contentElement =
      document.getElementById("article-content");

    const textElement =
      document.getElementById("article-text");

    const photoElement =
      document.getElementById("article-photo");

    const imageElement =
      document.getElementById("article-image");

    const canonicalElement =
      document.getElementById("canonical-url");

    const descriptionElement =
      document.getElementById("meta-description");

    const ogTitleElement =
      document.getElementById("og-title");

    const ogDescriptionElement =
      document.getElementById("og-description");

    const ogUrlElement =
      document.getElementById("og-url");

    const ogImageElement =
      document.getElementById("og-image");

    const twitterTitleElement =
      document.getElementById("twitter-title");

    const twitterDescriptionElement =
      document.getElementById("twitter-description");

    const twitterImageElement =
      document.getElementById("twitter-image");


    // 날짜 표시
    function formatDate(value) {
      if (!value) return "";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        timeZone: "Asia/Seoul"
      })
        .format(date)
        .replace(/\. /g, ".")
        .replace(/\.$/, "");
    }


    // 새 기사 주소 생성
    function makeCanonical(article) {
      const articleSlug = article.slug || slug;

      if (articleSlug) {
        return SITE_URL + "/news/" +
          encodeURIComponent(articleSlug);
      }

      return SITE_URL + "/";
    }


    // 기사 설명 생성
    function makeDescription(body, title) {
      const cleanText = String(body || "")
        .replace(/<[^>]*>/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      if (cleanText) {
        return cleanText.slice(0, 155);
      }

      return `${title} | FANTUBE ARCHIVE MEDIA`;
    }


    // SEO 메타데이터 갱신
    function updateSEO(article) {
      const title =
        article.title || "FANTUBE ARCHIVE MEDIA";

      const description =
        makeDescription(article.body, title);

      const canonical =
        makeCanonical(article);

      const rawImageUrl =
        String(article.thumbnail_url || "").trim();

      let imageUrl = "";

      if (rawImageUrl) {
        try {
          imageUrl = new URL(
            rawImageUrl,
            SITE_URL
          ).href;
        } catch (error) {
          imageUrl = "";
        }
      }

      document.title =
        `${title} | FANTUBE ARCHIVE MEDIA`;

      canonicalElement.href = canonical;

      descriptionElement.content = description;

      ogTitleElement.content = title;
      ogDescriptionElement.content = description;
      ogUrlElement.content = canonical;

      twitterTitleElement.content = title;
      twitterDescriptionElement.content = description;

      if (imageUrl) {
        ogImageElement.content = imageUrl;
        twitterImageElement.content = imageUrl;
      } else {
        ogImageElement.removeAttribute("content");
        twitterImageElement.removeAttribute("content");
      }
    }


    // 기사 본문 표시
    function renderBody(body) {
      textElement.replaceChildren();

      const paragraphs = String(body || "")
        .replace(/\r\n/g, "\n")
        .split(/\n\s*\n/)
        .map(paragraph => paragraph.trim())
        .filter(Boolean);

      if (paragraphs.length === 0) {
        const p = document.createElement("p");

        p.textContent = "등록된 본문이 없습니다.";

        textElement.appendChild(p);

        return;
      }

      for (const paragraph of paragraphs) {
        const p = document.createElement("p");

        p.textContent = paragraph;

        textElement.appendChild(p);
      }
    }


    // 기사 불러오기
    async function loadArticle() {

      if (!slug && !id) {
        titleElement.textContent =
          "기사를 찾을 수 없습니다.";

        statusElement.textContent =
          "기사 주소가 올바르지 않습니다. 뉴스 목록에서 다시 선택해 주세요.";

        document.querySelector(
          'meta[name="robots"]'
        ).content = "noindex, follow";

        return;
      }

      const key = slug
        ? "slug=" + encodeURIComponent(slug)
        : "id=" + encodeURIComponent(id);

      try {

        const response = await fetch(
          `${API_URL}?${key}`,
          {
            headers: {
              "Accept": "application/json"
            },
            cache: "no-store"
          }
        );

        const data = await response.json();

        if (!response.ok || !data.article) {
          throw new Error(
            data.error || "기사를 불러오지 못했습니다."
          );
        }

        const article = data.article;

        // 제목 및 카테고리
        titleElement.textContent =
          article.title || "제목 없음";

        categoryElement.textContent =
          article.category || "NEWS";


        // 기사 작성일
        const articleDate =
          article.published_at ||
          article.created_at ||
          article.date;

        metaElement.textContent = [
          "FANTUBE ARCHIVE MEDIA",
          formatDate(articleDate)
        ]
          .filter(Boolean)
          .join(" · ");


        // SEO 정보 갱신
        updateSEO(article);


        // 대표 이미지
        const imageUrl =
          String(article.thumbnail_url || "").trim();

        if (imageUrl) {

          imageElement.alt =
            article.title || "기사 사진";

          imageElement.onload = () => {
            photoElement.hidden = false;
          };

          imageElement.onerror = () => {
            photoElement.hidden = true;
            imageElement.removeAttribute("src");
          };

          imageElement.src = imageUrl;

          photoElement.hidden = false;

        } else {

          photoElement.hidden = true;

          imageElement.removeAttribute("src");

        }


        // 본문 표시
        renderBody(article.body);


        // 로딩 영역 숨기고 기사 표시
        statusElement.hidden = true;

        contentElement.hidden = false;

      } catch (error) {

        console.error(
          "기사 불러오기 실패:",
          error
        );

        titleElement.textContent =
          "기사를 불러오지 못했습니다.";

        statusElement.textContent =
          error.message ||
          "잠시 후 다시 시도해 주세요.";

        document.querySelector(
          'meta[name="robots"]'
        ).content = "noindex, follow";

      }
    }


    loadArticle();

  </script>

</body>
</html>
