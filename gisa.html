
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>기사 | FANTUBE ARCHIVE MEDIA</title>
  <meta name="description" content="FANTUBE ARCHIVE MEDIA 기사">

  <link rel="stylesheet" href="style.css">

  <style>
    .article-page {
      max-width: 850px;
      margin: 0 auto;
      padding: 100px 24px;
    }

    .article-back {
      display: inline-block;
      margin-bottom: 30px;
      color: inherit;
      text-decoration: none;
    }

    .article-title {
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.3;
      margin: 20px 0;
      overflow-wrap: anywhere;
    }

    .article-meta {
      margin: 20px 0 36px;
      color: #888;
      font-size: 13px;
    }

    .article-body {
      font-size: 17px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .article-body p {
      margin: 0 0 24px;
    }

    .article-photo {
      margin: 0 0 36px;
      padding: 0;
    }

    .article-photo img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .article-photo figcaption {
      margin-top: 10px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }

    .article-photo figcaption span {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .article-status {
      padding: 60px 0;
      color: #888;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <main class="article-page">
    <a class="article-back" href="index.html#news">
      ← NEWS 목록으로
    </a>

    <p class="news-category" id="article-category">NEWS</p>

    <h1 class="article-title" id="article-title">
      기사를 불러오는 중입니다.
    </h1>

    <p class="article-meta" id="article-meta">
      FANTUBE ARCHIVE MEDIA
    </p>

    <div id="article-status" class="article-status">
      잠시만 기다려 주세요.
    </div>

    <article class="article-body" id="article-content" hidden>
      <figure class="article-photo" id="article-photo" hidden>
        <img id="article-image" src="" alt="">
        <figcaption>
          <span>PHOTO © FANTUBE ARCHIVE MEDIA</span>
        </figcaption>
      </figure>

      <div id="article-text"></div>

      <p>
        <a href="index.html#archive">
          FANTUBE ARCHIVE MEDIA 영상 아카이브 둘러보기 ↗
        </a>
      </p>
    </article>
  </main>

  <script>
    const API_URL = "/api/articles";

    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");
    const id = params.get("id");

    const titleElement = document.getElementById("article-title");
    const categoryElement = document.getElementById("article-category");
    const metaElement = document.getElementById("article-meta");
    const statusElement = document.getElementById("article-status");
    const contentElement = document.getElementById("article-content");
    const textElement = document.getElementById("article-text");
    const photoElement = document.getElementById("article-photo");
    const imageElement = document.getElementById("article-image");

    function formatDate(value) {
      if (!value) return "";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        timeZone: "Asia/Seoul"
      }).format(date).replace(/\. /g, ".").replace(/\.$/, "");
    }

    function renderBody(body) {
      textElement.replaceChildren();

      const paragraphs = String(body || "")
        .replace(/\r\n/g, "\n")
        .split(/\n\s*\n/)
        .map(paragraph => paragraph.trim())
        .filter(Boolean);

      if (paragraphs.length === 0) {
        const p = document.createElement("p");
        p.textContent = "등록된 본문이 없습니다.";
        textElement.appendChild(p);
        return;
      }

      for (const paragraph of paragraphs) {
        const p = document.createElement("p");
        p.textContent = paragraph;
        textElement.appendChild(p);
      }
    }

    async function loadArticle() {
      if (!slug && !id) {
        titleElement.textContent = "기사를 찾을 수 없습니다.";
        statusElement.textContent =
          "기사 주소에 slug가 없습니다. 뉴스 목록에서 다시 선택해 주세요.";
        return;
      }

      const key = slug
        ? "slug=" + encodeURIComponent(slug)
        : "id=" + encodeURIComponent(id);

      try {
        const response = await fetch(`${API_URL}?${key}`, {
          headers: { "Accept": "application/json" },
          cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || !data.article) {
          throw new Error(data.error || "기사를 불러오지 못했습니다.");
        }

        const article = data.article;

        titleElement.textContent = article.title || "제목 없음";
        document.title =
          `${article.title || "기사"} | FANTUBE ARCHIVE MEDIA`;

        categoryElement.textContent = article.category || "NEWS";

        metaElement.textContent = [
          "FANTUBE ARCHIVE MEDIA",
          formatDate(article.created_at)
        ].filter(Boolean).join(" · ");

        const imageUrl = String(article.thumbnail_url || "").trim();

        if (imageUrl) {
          imageElement.alt = article.title || "기사 사진";
          imageElement.onload = () => {
            photoElement.hidden = false;
          };
          imageElement.onerror = () => {
            photoElement.hidden = true;
            imageElement.removeAttribute("src");
          };
          imageElement.src = imageUrl;
          photoElement.hidden = false;
        } else {
          photoElement.hidden = true;
          imageElement.removeAttribute("src");
        }

        renderBody(article.body);

        statusElement.hidden = true;
        contentElement.hidden = false;
      } catch (error) {
        console.error("기사 불러오기 실패:", error);
        titleElement.textContent = "기사를 불러오지 못했습니다.";
        statusElement.textContent =
          error.message || "잠시 후 다시 시도해 주세요.";
      }
    }

    loadArticle();
  </script>
</body>
</html>
